[project]
name = "gridpulse"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# API runtime only (Vercel reads this). Pipeline/dev extras: requirements-pipeline.txt, requirements-dev.txt.
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "slowapi==0.1.10",
  "PyYAML==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
markers = ["raw: needs source PDFs in data/raw (skipped when absent)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "engine", "pipeline", "ai", "tests"]

[tool.ruff.lint.per-file-ignores]
"backend/app/brief.py" = ["E501"]  # inline HTML/CSS template
"tests/*" = ["E501"]  # literal fixtures read better unwrapped
