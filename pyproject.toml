[project]
name = "gridpulse"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
markers = ["raw: needs source PDFs in data/raw (skipped when absent)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "engine", "pipeline", "ai", "tests"]

[tool.ruff.lint.per-file-ignores]
"backend/app/brief.py" = ["E501"]  # inline HTML/CSS template
